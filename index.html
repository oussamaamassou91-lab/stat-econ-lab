Home:()=>`<h1>STAT-ECON LAB</h1><h3>Professional Statistical &amp; Econometric Analysis Platform</h3><p>Analyze. Model. Test. Visualize. Explain.</p><p><button onclick="go('Data')">IMPORT DATA</button> <button onclick="go('Projects')">OPEN PROJECT</button> <button onclick="demo()">DATASET EXAMPLES</button> <button onclick="auto()">AUTO ANALYZE</button></p><p class=note>All analyses are performed locally on your device. No data is transmitted externally.</p><p>Last projects: ${Object.keys(JSON.parse(localStorage.getItem('statlab_projects')||'{}')).join(', ')||'none'}</p>`,
Data:()=>`<h2>Data</h2><p>Separator <select id=sep><option value=auto>auto</option><option value=",">,</option><option value=";">;</option><option value="\t">tab</option></select> Decimal <select id=dec><option>.</option><option>,</option></select></p><input type=file id=fi accept=".csv,.tsv,.txt,.json"> <button onclick="demo()">Load demo (Synthetic Marketing)</button><br><textarea id=paste placeholder="Or paste data here" rows=4 style="width:60%"></textarea><br><button onclick="load($('#paste').value)">Import pasted data</button>`+(DS?dict():''),
Describe:()=>`<h2>Descriptive statistics</h2>${need()}`+(DS?`<select id=dv>${opts(num)}</select> <button onclick="runDesc()">Run</button>`:'')+'<div id=res></div>',
Correlation:()=>`<h2>Correlation</h2>${need()}`+(DS?`<button onclick="runCor('pearson')">Pearson</button> <button onclick="runCor('spearman')">Spearman</button>`:'')+'<div id=res></div>',
Tests:()=>`<h2>Hypothesis tests</h2>${need()}`+(DS?`<h4>Normality (Jarque-Bera)</h4><select id=nv>${opts(num)}</select><button onclick="runJB()">Run</button><h4>t-test (Welch) numeric by 2-level group</h4><select id=tv>${opts(num)}</select> by <select id=tg>${opts(cat)}</select><button onclick="runT()">Run</button><h4>One-sample t-test</h4><select id=t1>${opts(num)}</select> μ0 <input id=mu value=0 size=4><button onclick="runT1()">Run</button><h4>Chi-square independence</h4><select id=c1>${opts(cat)}</select> × <select id=c2>${opts(cat,DS.cols.filter(cat)[1])}</select><button onclick="runChi()">Run</button>`:'')+'<div id=res></div>',
ANOVA:()=>`<h2>One-way ANOVA</h2>${need()}`+(DS?`<select id=ay>${opts(num)}</select> by <select id=ag>${opts(cat)}</select><button onclick="runAnova()">Run</button>`:'')+'<div id=res></div>',
Regression:()=>`<h2>Regression</h2>${need()}`+(DS?`<p>Formula Lab: <input id=form size=40 value="${DS.cols.includes('sales')?'sales ~ tv + radio + price':DS.cols[DS.cols.length-1]+' ~ '+DS.cols.slice(0,-1).join(' + ')}"> <select id=rt><option value=ols>OLS</option><option value=logit>Logit</option></select> <button onclick="runReg()">Run</button></p><p class=note>Numeric predictors only (use 0/1 dummies for categories). Rows with missing values are dropped.</p>`:'')+'<div id=res></div>',
Decision:()=>`<h2>Statistical Decision Engine</h2>${need()}`+(DS?`<p>Dependent <select id=dy>${opts()}</select> Independent <select id=dx>${opts()}</select> <button onclick="runDec()">Recommend</button></p>`:'')+'<div id=res></div>',
'Code Lab':()=>`<h2>Code Lab (JavaScript, local)</h2><p class=note>Variables: <code>DS</code> (dataset), <code>S</code> (stat library). R/Python code is generated per analysis; WebR/Pyodide execution needs their runtime files placed in /libs (see README).</p><textarea id=code rows=8 style="width:90%">const [y]=S.complete(DS,[DS.cols.find(c=>DS.types[c]==='numeric')]);S.describe(y)</textarea><br><button onclick="runCode()">Run (Ctrl+Enter)</button><pre id=res></pre>`,
Report:()=>`<h2>Report</h2><p>Accumulated results:</p><div id=rep>${REPORT.join('<hr>')||'No results yet. Use "Add to report" after an analysis.'}</div><button onclick="dl('report.html','<meta charset=utf-8><style>body{font-family:sans-serif}table{border-collapse:collapse}td,th{border:1px solid #999;padding:3px 8px}</style>'+REPORT.join('<hr>'))">Export HTML report</button>`,
Projects:()=>`<h2>Projects (browser localStorage)</h2><input id=pn placeholder="Project name"> <button onclick="saveP()">Save Project</button> <button onclick="expP()">Export Project</button> <input type=file id=impP><div id=pl>${Object.keys(JSON.parse(localStorage.getItem('statlab_projects')||'{}')).map(n=>`<p>${n} <button onclick="openP('${n}')">Open</button> <button onclick="delP('${n}')">Delete</button></p>`).join('')}</div>`};
let REPORT=[];const INIT={Data(){$('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let t=r.result;if(f.name.endsWith('.json')){try{const j=JSON.parse(t),k=Object.keys(j[0]);t=k.join(',')+'\n'+j.map(o=>k.map(c=>o[c]).join(',')).join('\n')}catch(e){return alert('Invalid JSON')}}load(t)};r.readAsText(f)}},Projects(){$('#impP').onchange=e=>{const r=new FileReader();r.onload=()=>{const p=JSON.parse(r.result);DS=S.parse(p.raw,'auto','.');alert('Project imported');go('Data')};r.readAsText(e.target.files[0])}}};
function demo(){load(S.demo())}
function dict(){const n=DS.n,miss=DS.cols.reduce((s,c)=>s+DS.data[c].filter(v=>v===null).length,0);return `<h3>${n} rows × ${DS.cols.length} columns, missing ${(100*miss/(n*DS.cols.length)).toFixed(2)}%</h3>`+tbl(['Variable','Type','N','Missing','Unique','Mean','SD','Min','Max'],DS.cols.map(c=>{const v=DS.data[c].filter(x=>x!==null),isn=DS.types[c]!=='categorical';return [c,`<select onchange="DS.types['${c}']=this.value">${['numeric','binary','categorical'].map(t=>`<option ${t===DS.types[c]?'selected':''}>${t}</option>`).join('')}</select>`,v.length,n-v.length,new Set(v).size,isn?F(S.mean(v)):'',isn?F(S.sd(v)):'',isn?F(Math.min(...v),2):'',isn?F(Math.max(...v),2):'']}))+'<h4>Preview</h4>'+tbl(DS.cols,Array.from({length:Math.min(8,n)},(_,i)=>DS.cols.map(c=>DS.data[c][i]??'NA')))}
function runDesc(){const c=$('#dv').value,[a]=S.complete(DS,[c]),d=S.describe(a);out(`<h3>${c}</h3>`+tbl(['Statistic','Value'],Object.entries(d).map(([k,v])=>[k,F(v)]))+hist(a)+`<p>Interpretation: mean ${F(d.mean,2)} vs median ${F(d.median,2)}; skewness ${F(d.skew,2)} indicates ${Math.abs(d.skew)<.5?'an approximately symmetric':d.skew>0?'a right-skewed':'a left-skewed'} distribution.</p>`,1,`summary(df$${c}); sd(df$${c}, na.rm=TRUE)`,`df['${c}'].describe()`)}
function runCor(m){const ns=DS.cols.filter(num),D=S.complete(DS,ns),f=m==='pearson'?S.cor:S.spearman;out(`<h3>${m} correlation matrix</h3>`+tbl(['',...ns],ns.map((a,i)=>[a,...ns.map((b,j)=>{const r=f(D[i],D[j]);return `<span style="background:rgba(${r>0?'59,130,246':'239,68,68'},${Math.abs(r)*.6})">${F(r,3)}</span>`})])),1,`cor(df[sapply(df,is.numeric)], method="${m}")`,`df.select_dtypes('number').corr(method='${m}')`)}
function runJB(){const c=$('#nv').value,[a]=S.complete(DS,[c]),r=S.jb(a);out(`<h3>Jarque-Bera: ${c}</h3>`+tbl(['JB','p-value','Conclusion'],[[F(r.stat),F(r.p),r.p<.05?'Reject normality (p<0.05)':'No evidence against normality']])+hist(a),1,`tseries::jarque.bera.test(df$${c})`,`from scipy.stats import jarque_bera; jarque_bera(df['${c}'].dropna())`)}
function runT(){const y=$('#tv').value,g=$('#tg').value,[v,gg]=S.complete(DS,[y,g]),G=S.groups(v,gg),k=Object.keys(G);if(k.length!==2)return out(`<p class=warn>Analysis unavailable. Reason: "${g}" has ${k.length} levels (need 2). Suggested solution: use ANOVA for 3+ groups.</p>`);const r=S.welch(G[k[0]],G[k[1]]);out(`<h3>Welch t-test: ${y} by ${g}</h3><p>H0: equal means.</p>`+tbl(['Group A','Group B','Diff','t','df','p','95% CI','Cohen d'],[[k[0],k[1],F(r.diff),F(r.t),F(r.df,2),F(r.p),`[${F(r.ci[0])}, ${F(r.ci[1])}]`,F(r.cohenD,3)]])+`<p>Interpretation: ${r.p<.05?'significant':'no significant'} difference between groups at α=0.05.</p>`,1,`t.test(${y} ~ ${g}, data=df)`,`from scipy.stats import ttest_ind; ttest_ind(a, b, equal_var=False)`)}
function runT1(){const c=$('#t1').value,mu=+$('#mu').value,[a]=S.complete(DS,[c]),r=S.ttest1(a,mu);out(`<h3>One-sample t-test: ${c}</h3>`+tbl(['Mean','μ0','t','df','p','95% CI'],[[F(r.mean),mu,F(r.t),r.df,F(r.p),`[${F(r.ci[0])}, ${F(r.ci[1])}]`]]),1,`t.test(df$${c}, mu=${mu})`,`from scipy.stats import ttest_1samp; ttest_1samp(df['${c}'].dropna(), ${mu})`)}
function runChi(){const a=$('#c1').value,b=$('#c2').value,[A,B]=S.complete(DS,[a,b]);if(a===b)return out('<p class=warn>Analysis unavailable. Reason: same variable twice.</p>');const r=S.chisq(A,B);out(`<h3>Chi-square: ${a} × ${b}</h3>`+tbl(['',...r.cols],r.rows.map((x,i)=>[x,...r.table[i]]))+tbl(['χ²','df','p','Cramér V'],[[F(r.chi2),r.df,F(r.p),F(r.cramerV,3)]])+(r.lowExpected?`<p class=warn>${r.lowExpected} cells with expected count &lt; 5: interpret with caution.</p>`:''),1,`chisq.test(table(df$${a}, df$${b}))`,`from scipy.stats import chi2_contingency; chi2_contingency(pd.crosstab(df['${a}'], df['${b}']))`)}
function runAnova(){const y=$('#ay').value,g=$('#ag').value,[v,gg]=S.complete(DS,[y,g]);const r=S.anova(v,gg);if(r.k<2||r.d2<1)return out('<p class=warn>Analysis unavailable. Reason: need ≥2 groups and n&gt;k.</p>');const h=r.levene.p<.05;out(`<h3>One-way ANOVA: ${y} ~ ${g}</h3><p>H0: all group means equal.</p>`+tbl(['Source','SS','df','MS','F','p'],[['Between',F(r.ssb),r.d1,F(r.msb),F(r.F),F(r.p)],['Within',F(r.ssw),r.d2,F(r.msw),'','']])+tbl(['η²','Levene/BF F','Levene p','Welch F','Welch df2','Welch p','Kruskal H','Kruskal p'],[[F(r.eta2,3),F(r.levene.F),F(r.levene.p),F(r.welch.F),F(r.welch.df2,2),F(r.welch.p),F(r.kruskal.H),F(r.kruskal.p)]])+tbl(['Group','n','Mean','SD'],r.means.map(m=>[m.g,m.n,F(m.mean),F(m.sd)]))+'<h4>Post-hoc (Bonferroni pairwise t, pooled MSE)</h4>'+tbl(['A','B','Diff','t','p','p adj'],r.pairs.map(p=>[p.a,p.b,F(p.diff),F(p.t),F(p.p),F(p.pAdj)]))+`<p>Interpretation: ${r.p<.05?'at least one group mean differs':'no significant difference'} (F(${r.d1},${r.d2})=${F(r.F,2)}, p=${F(r.p)}). ${h?'Variances are heterogeneous; prefer Welch ANOVA.':'Variance homogeneity not rejected.'}</p>`,1,`fit <- aov(${y} ~ ${g}, data=df); summary(fit); TukeyHSD(fit)`,`import statsmodels.formula.api as smf, statsmodels.api as sm\nm = smf.ols('${y} ~ C(${g})', data=df).fit(); sm.stats.anova_lm(m)`)}
function parseForm(){const [l,r]=$('#form').value.split('~');const y=l.trim(),xs=r.split('+').map(s=>s.trim()).filter(Boolean);[y,...xs].forEach(c=>{if(!DS.cols.includes(c))throw new Error('Unknown variable: '+c);if(DS.types[c]==='categorical')throw new Error(c+' is categorical; create numeric dummies')});return{y,xs}}
function runReg(){try{const{y,xs}=parseForm(),D=S.complete(DS,[y,...xs]),f=$('#form').value;if($('#rt').value==='ols'){const m=S.ols(D[0],D.slice(1),xs);out(`<h3>OLS: ${f}</h3>`+tbl(['Term','Estimate','Std.Err','t','p',''],m.names.map((n,i)=>[n,F(m.b[i]),F(m.se[i]),F(m.t[i],3),F(m.p[i]),S.star(m.p[i])]))+tbl(['N','R²','Adj R²','F','F p','RMSE','Durbin-Watson','Breusch-Pagan p','Jarque-Bera p'],[[m.n,F(m.r2,3),F(m.adjr2,3),F(m.F,2),F(m.Fp),F(m.rmse),F(m.dw,3),m.bp?F(m.bp.p):'NA',F(m.jb.p)]])+(m.vif.length?tbl(['Variable','VIF'],xs.map((x,i)=>[x,F(m.vif[i],2)])):'')+`<p>Standard errors classical. *** p&lt;0.01, ** p&lt;0.05, * p&lt;0.1.</p><p>Interpretation: model explains ${(100*m.r2).toFixed(1)}% of variance in ${y}. ${m.bp&&m.bp.p<.05?'Heteroskedasticity detected: use robust SE. ':''}${m.jb.p<.05?'Residuals non-normal. ':''}${Math.max(...m.vif,0)>10?'High multicollinearity. ':''}</p>`,1,`fit <- lm(${f}, data=df); summary(fit); lmtest::bptest(fit); car::vif(fit)`,`import statsmodels.formula.api as smf\nm = smf.ols('${f}', data=df).fit(); print(m.summary())`)}else{const m=S.logit(D[0],D.slice(1),xs);out(`<h3>Logit: ${f}</h3>`+tbl(['Term','Coef','Std.Err','z','p','Odds ratio',''],m.names.map((n,i)=>[n,F(m.b[i]),F(m.se[i]),F(m.z[i],3),F(m.p[i]),F(m.or[i],3),S.star(m.p[i])]))+tbl(['N','Log-lik','McFadden R²','LR χ²','LR p','Accuracy'],[[m.n,F(m.ll,2),F(m.mcfadden,3),F(m.lr,2),F(m.lrp),F(m.acc,3)]]),1,`glm(${f}, data=df, family=binomial)`,`smf.logit('${f}', data=df).fit()`)}}catch(e){out(`<p class=warn>Analysis unavailable. Reason: ${e.message}. Suggested solution: check variables, sample size and collinearity.</p>`)}}
function runDec(){const y=$('#dy').value,x=$('#dx').value;let rec;const ty=DS.types[y],tx=DS.types[x];if(y===x)return out('<p class=warn>Choose two different variables.</p>');if(ty==='numeric'&&tx==='categorical'){const[v,g]=S.complete(DS,[y,x]),k=new Set(g).size;const a=k>2?S.anova(v,g):null;rec=`Detected 1 quantitative dependent variable, 1 categorical independent variable, ${k} groups.<br>Recommendation: ${k===2?'Welch t-test':'One-way ANOVA'}.`+(a?`<br>Levene p=${F(a.levene.p)}: ${a.levene.p<.05?'variances heterogeneous → <b>Welch ANOVA</b>':'homogeneous → classic ANOVA OK'}.<br>Non-parametric alternative: Kruskal-Wallis (p=${F(a.kruskal.p)}).`:'')}else if(ty==='numeric'&&tx==='numeric')rec='Quantitative vs quantitative: Pearson correlation (Spearman if non-normal) and simple OLS regression with diagnostics.';else if(ty!=='numeric'&&tx==='numeric'&&ty==='binary')rec='Binary dependent, numeric predictor: logistic regression (Logit).';else if(ty!=='numeric'&&tx!=='numeric')rec='Two categorical variables: chi-square test of independence (Fisher exact if expected counts &lt;5).';else rec='Categorical dependent with numeric predictor: logistic regression (binary) or multinomial.';out(`<h3>Recommendation</h3><p>${rec}</p><p class=note>Deterministic rules; no external AI.</p>`)}
function auto(){if(!DS)demo();setTimeout(()=>{go('Describe');const c=DS.cols.find(c=>DS.types[c]==='numeric');$('#dv').value=c;runDesc()},50)}
function runCode(){try{const r=Function('DS','S',`return (${$('#code').value.trim().split('\n').length>1&&!/^\s*(return|const|let|var)/.test($('#code').value)?$('#code').value:'(()=>{'+$('#code').value.replace(/;\s*([^;]+);?\s*$/,';return $1')+'})()'})`)(DS,S);$('#res').textContent=JSON.stringify(r,null,2)}catch(e){$('#res').textContent='Error: '+e.message}}
function dl(n,s){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/html'}));a.download=n;a.click()}
function saveP(){const n=$('#pn').value||'Project';const P=JSON.parse(localStorage.getItem('statlab_projects')||'{}');P[n]={raw:window.RAW,types:DS?.types,report:REPORT};localStorage.setItem('statlab_projects',JSON.stringify(P));go('Projects')}
function openP(n){const p=JSON.parse(localStorage.getItem('statlab_projects'))[n];DS=S.parse(p.raw,'auto','.');DS.types=p.types;window.RAW=p.raw;REPORT=p.report||[];go('Data')}
function delP(n){const P=JSON.parse(localStorage.getItem('statlab_projects'));delete P[n];localStorage.setItem('statlab_projects',JSON.stringify(P));go('Projects')}
function expP(){if(!DS)return alert('No dataset');dl('project.json',JSON.stringify({raw:window.RAW,types:DS.types,report:REPORT}))}
const _out=out;out=function(h,c,r,p){_out(h,c,r,p);if(c)$('#res').insertAdjacentHTML('beforeend','<p><button onclick="REPORT.push(LAST);this.textContent=\'Added\'">Add to report</button></p>')};
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter'&&$('#code'))runCode();if(e.ctrlKey&&e.key==='s'){e.preventDefault();saveP()}});
nav();go('Home');
</script></body></html>
